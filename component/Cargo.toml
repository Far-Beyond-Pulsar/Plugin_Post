[package]
name = "post_component"
version = "0.1.0"
edition = "2024"
description = "Post-process volumes (pulsar.post): the post-process volume and camera baseline components, their rows, their row join and the plugin's Helio feature set (the volume blend)"

# The plugin's root crate (`post_plugin`) submits what this crate defines:
# the component classes, the scene rows and the render feature.
[lib]
name = "post_component"

[features]
# `#[derive(SceneStore)]` checks the deriving crate's own `gpu` feature.
default = ["gpu"]
gpu = []

[dependencies]
engine_class_derive = { workspace = true }
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
gpui-ce = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
pulsar_world_registry = { workspace = true }
pulsar_scene_model = { workspace = true }
helio_component = { workspace = true }
# The engine-class derive logs through it.
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
wgpu = { workspace = true }
helio-feature-api = { workspace = true }
helio-scene-join = { workspace = true }
helio-pass-postprocess = { workspace = true }
helio-pass-post-volumes = { workspace = true }

[lints]
workspace = true
