# ── GPU buffer keys ─────────────────────────────────────────────

[[buffer]]
key = "camera_postprocess"
producers = ["CameraPostProcessComponent"]
consumers = ["helio-pass-post-volumes"]
owner = "helio-scene-derivations environment join (execution output, one row per component instance)"
disposition = "keep: the join copies each placed, enabled CameraPostProcessComponent row; the editor baseline is the resolver's defaults (EditorPostProcess), not a scene row"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/fog/tests/scene_rows.rs; plugins/installed/tests/render_acceptance.rs (environment_components_reach_the_frame); crates/core/engine_backend/tests/editor_bloom_toggle.rs"
status = "verified"

[[buffer]]
key = "post_process_volumes"
producers = ["PostProcessVolumeComponent"]
consumers = ["helio-pass-post-volumes"]
owner = "helio-scene-derivations environment join (execution output, one row per component instance)"
disposition = "keep: the join places each volume from its owner's transform; the post-process resolver reads it (fog reads its own media rows since p17)"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/fog/tests/scene_rows.rs; plugins/installed/tests/render_acceptance.rs (environment_components_reach_the_frame)"
status = "verified"

[[buffer]]
key = "post_process_volume_sources"
producers = ["PostProcessVolumeSourceRow"]
consumers = []
owner = "helio_component::components::environment_rows"
disposition = "keep: PostProcessVolumeComponent in its owner's space, derived on every write; the environment join reads it into post_process_volumes"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/fog/tests/scene_rows.rs"
status = "verified"

[[buffer]]
key = "camera_postprocess_sources"
producers = ["CameraPostProcessSourceRow"]
consumers = []
owner = "helio_component::components::environment_rows"
disposition = "keep: CameraPostProcessComponent in its owner's space, derived on every write; the environment join reads it into camera_postprocess"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/fog/tests/scene_rows.rs"
status = "verified"

# ── Render pass crates ──────────────────────────────────────────

[[pass]]
crate = "helio-pass-post-volumes"
in_default_graph = false
reads = ["camera_postprocess", "post_process_volumes"]
owner = "helio-pass-post-volumes"
disposition = "keep: the kind's own, moved with it into its plugin (plugin-migration.md Phases B and C)"
target_contract = "Phase C; plugin-migration.md"
test = "none: no test names this row; the owning plugin's suites cover its behaviour"
status = "unverified"
